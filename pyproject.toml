[project]
name = "miniagent"
version = "0.5.0"
description = "A minimal from-scratch coding agent (Claude Code-style loop) with pluggable OpenAI-compatible providers: BigModel, OpenRouter, NVIDIA, Gemini, Groq, DeepSeek..."
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "httpx>=0.27"]

[project.optional-dependencies]
# `uv pip install -e ".[gui]"` — the web GUI; core CLI stays dependency-light
gui = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
miniagent = "miniagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["miniagent"]
